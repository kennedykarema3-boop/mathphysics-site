<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Progress — MathPhysics Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Install as an app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f4e79">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MathPhysics">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body data-page="progress">

  <div id="site-header"></div>

  <main class="page">
    <h1>My Progress</h1>
    <p class="lead">Your quiz results are saved on this device. Aim for 80% or more on every topic.</p>

    <!-- Filled in by js/progress-page.js -->
    <div class="stat-row" id="summary"></div>
    <div id="mixed-summary"></div>
    <div id="progress-list"></div>

    <button class="btn btn-danger" id="reset">Reset my progress</button>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/progress-page.js"></script>
</body>
</html>
